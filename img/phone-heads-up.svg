<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-label="Illustration of a phone showing a text: a driver shared a concern about the blue Civic, following too close, next to a steaming number one mother coffee mug">
<defs>
  <radialGradient id="pbg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#FFD21F"/></radialGradient>
  <linearGradient id="bez" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3b3b"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F2F4F8"/></linearGradient>
  <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2a"/><stop offset=".45" stop-color="#4a4a4a"/><stop offset="1" stop-color="#151515"/></linearGradient>
  <clipPath id="pc"><circle cx="220" cy="210" r="196"/></clipPath>
</defs>
<g clip-path="url(#pc)">
  <rect width="440" height="420" fill="url(#pbg)"/>
  <path d="M0 330 H440 V420 H0Z" fill="#F4E3A1"/>
  <path d="M0 330 H440" stroke="#111" stroke-width="4"/>
  <path d="M30 360 h70 M150 380 h50 M300 362 h90" stroke="#D9C373" stroke-width="5" stroke-linecap="round"/>
</g>
<circle cx="220" cy="210" r="196" fill="none" stroke="#111" stroke-width="5"/>
<!-- worry marks -->
<g stroke="#111" stroke-width="5" stroke-linecap="round" fill="none">
  <path d="M84 120 l-18 -10 M80 150 l-22 0 M84 180 l-18 10"/>
  <path d="M346 112 l16 -12 M352 140 l22 -2"/>
</g>
<!-- phone -->
<g transform="rotate(-6 200 190)">
  <rect x="124" y="40" width="168" height="316" rx="30" fill="#000" opacity=".18" transform="translate(10 10)"/>
  <rect x="124" y="40" width="168" height="316" rx="30" fill="url(#bez)" stroke="#111" stroke-width="4"/>
  <rect x="134" y="52" width="148" height="292" rx="21" fill="url(#scr)"/>
  <rect x="184" y="60" width="48" height="12" rx="6" fill="#111"/>
  <text x="146" y="70" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="9" fill="#111">7:52</text>
  <circle cx="208" cy="100" r="16" fill="#FFD21F" stroke="#111" stroke-width="3"/>
  <text x="208" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="12" fill="#111">MB</text>
  <text x="208" y="129" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="9" fill="#777">Mother Bumper</text>
  <path d="M148 140 H266 Q272 140 272 146 V250 Q272 256 266 256 H160 L146 268 V146 Q146 140 152 140 Z" fill="#E6E7ED"/>
  <g font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#111">
    <text x="156" y="160">A driver shared a</text>
    <text x="156" y="176">concern about</text>
    <text x="156" y="192" font-weight="800">the blue Civic</text>
    <text x="156" y="208">near Elm &amp; 5th:</text>
    <text x="156" y="230" font-weight="700">- Following</text>
    <text x="156" y="244" font-weight="700">  too close</text>
  </g>
  <g transform="translate(208 296)">
    <path d="M0 -26 L28 22 Q30 26 26 26 H-26 Q-30 26 -28 22 Z" fill="#FFD21F" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-3.5" y="-10" width="7" height="22" rx="3" fill="#111"/>
    <circle cx="0" cy="19" r="3.8" fill="#111"/>
  </g>
  <path d="M146 64 L180 64 L146 130 Z" fill="#fff" opacity=".5"/>
</g>
<!-- mug -->
<g transform="translate(292 228)">
  <path d="M18 -14 q-10 -16 2 -30 q10 -14 0 -28" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M44 -10 q-10 -16 2 -30 q10 -14 0 -28" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M84 26 q34 0 34 30 q0 30 -34 30" stroke="#111" stroke-width="13" fill="none"/>
  <path d="M84 26 q34 0 34 30 q0 30 -34 30" stroke="#3a3a3a" stroke-width="6" fill="none"/>
  <path d="M0 0 h88 v100 q0 14 -14 14 h-60 q-14 0 -14 -14z" fill="url(#mug)" stroke="#111" stroke-width="4"/>
  <ellipse cx="44" cy="0" rx="44" ry="9" fill="#5a3b22" stroke="#111" stroke-width="4"/>
  <text x="44" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="26" fill="#FFD21F">#1</text>
  <text x="44" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="14" fill="#fff" letter-spacing="1">MOTHER</text>
  <path d="M10 12 v86" stroke="#fff" stroke-width="4" opacity=".25" stroke-linecap="round"/>
</g>
</svg>
